<input id="search" placeholder="Search students...">

<table border="1" cellpadding="10">
    <thead>
        <tr><th>Name</th><th>Course</th></tr>
    </thead>
    <tbody id="students">
        <tr><td>Rahul</td><td>CSE</td></tr>
        <tr><td>Debabrata</td><td>AIML</td></tr>
        <tr><td>Priya</td><td>ECE</td></tr>
    </tbody>
</table>

<script>
document.getElementById("search").addEventListener("input", function() {
    const query = this.value.toLowerCase();

    document.querySelectorAll("#students tr").forEach(row => {
        row.hidden = !row.textContent.toLowerCase().includes(query);
    });
});
</script>
