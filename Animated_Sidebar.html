
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Sidebar</title>
<style>
body { margin: 0; font-family: Arial; }
button { padding: 12px; cursor: pointer; }
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: 250px; padding: 20px;
  background: #172033; color: white;
  transform: translateX(-100%);
  transition: transform .3s ease;
}
.sidebar.open { transform: translateX(0); }
.sidebar a {
  display: block; color: white;
  padding: 14px; text-decoration: none;
}
.sidebar a:hover { background: #34445f; }
</style>
</head>
<body>
<button id="toggle" aria-expanded="false">☰ Menu</button>
<aside id="sidebar" class="sidebar">
  <button id="close">✕ Close</button>
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>
</aside>
<script>
const sidebar = document.getElementById("sidebar");
const toggle = document.getElementById("toggle");

function setMenu(open) {
  sidebar.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", String(open));
}
toggle.onclick = () => setMenu(!sidebar.classList.contains("open"));
document.getElementById("close").onclick = () => setMenu(false);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") setMenu(false);
});
</script>
</body>
</html>
