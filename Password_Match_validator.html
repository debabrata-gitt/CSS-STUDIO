
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Password Match</title></head>
<body>
<form id="form">
  <input id="p1" type="password" placeholder="Password" required minlength="8">
  <input id="p2" type="password" placeholder="Confirm password" required>
  <button>Check</button>
  <p id="message" aria-live="polite"></p>
</form>
<script>
const form = document.getElementById("form");
form.onsubmit = e => {
  e.preventDefault();
  const a = document.getElementById("p1").value;
  const b = document.getElementById("p2").value;
  const message = document.getElementById("message");
  if (a !== b) {
    message.textContent = "Passwords do not match.";
  } else {
    message.textContent = "Passwords match.";
  }
};
</script>
</body>
</html>
