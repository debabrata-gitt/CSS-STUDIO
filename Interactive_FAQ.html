<style>
.faq { max-width: 600px; margin: 20px auto; }
.question {
    width: 100%;
    padding: 15px;
    text-align: left;
    cursor: pointer;
}
.answer { display: none; padding: 15px; background: #eee; }
.answer.open { display: block; }
</style>

<div class="faq">
    <button class="question">What is HTML?</button>
    <div class="answer">HTML structures webpages.</div>

    <button class="question">What is CSS?</button>
    <div class="answer">CSS styles webpages.</div>

    <button class="question">What is JavaScript?</button>
    <div class="answer">JavaScript adds interactivity.</div>
</div>

<script>
document.querySelectorAll(".question").forEach(button => {
    button.addEventListener("click", () => {
        button.nextElementSibling.classList.toggle("open");
    });
});
</script>
