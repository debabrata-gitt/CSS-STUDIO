
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 25px 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #e0e7ff, #f5d0fe);
    }

    .form-card {
        width: min(420px, 92%);
        padding: 30px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 15px 40px #312e811c;
    }

    h2 {
        margin-top: 0;
        color: #312e81;
        text-align: center;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
        background: white;
    }

    input:focus, select:focus {
        outline: 2px solid #818cf8;
        border-color: #6366f1;
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background: #3730a3;
    }
</style>
</head>
<body>
<form class="form-card">
    <h2>Create Account</h2>

    <div class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text"
               placeholder="Enter your name" required>
    </div>

    <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email"
               placeholder="you@example.com" required>
    </div>

    <div class="field">
        <label for="course">Choose Course</label>
        <select id="course" required>
            <option value="">Select a course</option>
            <option>HTML & CSS</option>
            <option>Python</option>
            <option>JavaScript</option>
        </select>
    </div>

    <button class="submit-btn" type="submit">
        Register
    </button>
</form>
</body>
</html>
