
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
    }

    nav {
        padding: 22px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #4f46e5;
    }

    .hero {
        max-width: 1200px;
        min-height: 80vh;
        margin: auto;
        padding: 60px 8%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 45px;
    }

    .hero h1 {
        font-size: clamp(36px, 5vw, 60px);
        line-height: 1.1;
        margin: 0 0 20px;
    }

    .hero p {
        line-height: 1.8;
        color: #64748b;
    }

    .hero img {
        width: 100%;
        border-radius: 24px;
    }

    .cta {
        display: inline-block;
        margin-top: 15px;
        padding: 14px 22px;
        border-radius: 9px;
        background: #4f46e5;
        color: white;
        text-decoration: none;
    }

    .cta:hover { background: #3730a3; }

    @media (max-width: 700px) {
        .hero {
            grid-template-columns: 1fr;
            padding-top: 40px;
        }
    }
</style>
</head>
<body>
<nav>
    <div class="logo">LaunchPro</div>
    <span>Build Something Great</span>
</nav>

<main class="hero">
    <div>
        <h1>Turn Your Ideas Into Reality</h1>
        <p>Create beautiful digital experiences with a clean,
           modern and responsive website.</p>
        <a class="cta" href="#features">Explore Features</a>
    </div>

    <img
      src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900"
      alt="Developer working on a computer">
</main>

<section id="features" style="padding: 40px; text-align: center;">
    <h2>Designed for Creators</h2>
    <p>Simple layouts. Beautiful design. Responsive experiences.</p>
</section>
</body>
</html>
