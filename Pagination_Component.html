
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font: 16px Arial; padding: 20px; }
#items li { padding: 8px; }
button { margin: 4px; padding: 8px 12px; }
</style>
</head>
<body>
<ul id="items"></ul>
<button id="prev">Previous</button>
<span id="page"></span>
<button id="next">Next</button>
<script>
const data = Array.from({length: 23}, (_, i) => `Record ${i + 1}`);
const pageSize = 5;
let current = 0;

function render() {
  const start = current * pageSize;
  const items = document.getElementById("items");
  items.replaceChildren();
  data.slice(start, start + pageSize).forEach(value => {
    const li = document.createElement("li");
    li.textContent = value;
    items.appendChild(li);
  });
  document.getElementById("page").textContent =
    `Page ${current + 1} of ${Math.ceil(data.length / pageSize)}`;
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = start + pageSize >= data.length;
}
document.getElementById("prev").onclick = () => { current--; render(); };
document.getElementById("next").onclick = () => { current++; render(); };
render();
</script>
</body>
</html>
