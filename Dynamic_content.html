
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font: 16px Arial; padding: 20px; }
[role="tablist"] { display: flex; gap: 8px; }
[role="tab"] { padding: 12px; border: 0; cursor: pointer; }
[role="tab"][aria-selected="true"] {
  background: #1d4ed8; color: white;
}
[role="tabpanel"] { padding: 20px; background: #eee; }
</style>
</head>
<body>
<div role="tablist" aria-label="Profile sections">
  <button role="tab" aria-selected="true" aria-controls="panel"
          data-content="Developer skills: HTML, CSS, JavaScript.">Skills</button>
  <button role="tab" aria-selected="false" aria-controls="panel"
          data-content="Education: B.Tech Computer Science.">Education</button>
  <button role="tab" aria-selected="false" aria-controls="panel"
          data-content="Projects: Portfolio and dashboard.">Projects</button>
</div>
<div id="panel" role="tabpanel" tabindex="0">
  Developer skills: HTML, CSS, JavaScript.
</div>
<script>
const tabs = [...document.querySelectorAll('[role="tab"]')];
const panel = document.getElementById("panel");

tabs.forEach((tab, index) => {
  tab.onclick = () => {
    tabs.forEach(t => t.setAttribute("aria-selected", "false"));
    tab.setAttribute("aria-selected", "true");
    panel.textContent = tab.dataset.content;
  };
  tab.onkeydown = e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const step = e.key === "ArrowRight" ? 1 : -1;
      tabs[(index + step + tabs.length) % tabs.length].focus();
    }
  };
});
</script>
</body>
</html>
