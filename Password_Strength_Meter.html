
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font: 16px Arial; max-width: 400px; margin: 30px auto; }
input { width: 100%; padding: 12px; box-sizing: border-box; }
meter { width: 100%; height: 20px; }
</style>
</head>
<body>
<label for="password">Create Password</label>
<input type="password" id="password" autocomplete="new-password">
<meter id="meter" min="0" max="4" value="0"></meter>
<p id="strength" aria-live="polite">Enter a password.</p>
<script>
const input = document.getElementById("password");
const meter = document.getElementById("meter");
const output = document.getElementById("strength");

input.oninput = () => {
  const value = input.value;
  let score = 0;
  if (value.length >= 8) score++;
  if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
  if (/\d/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;
  meter.value = score;
  output.textContent = ["Very weak", "Weak", "Fair", "Good", "Strong"][score];
};
</script>
</body>
</html>
