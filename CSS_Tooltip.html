
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Tooltip</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
    }

    .tooltip-container {
        position: relative;
        display: inline-block;
    }

    .trigger {
        padding: 15px 25px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }

    .tooltip {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%) translateY(5px);
        padding: 10px 14px;
        border-radius: 6px;
        background: #0f172a;
        color: white;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
    }

    .tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top-color: #0f172a;
    }

    .tooltip-container:hover .tooltip,
    .tooltip-container:focus-within .tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>
    <div class="tooltip-container">
        <button class="trigger" aria-describedby="tip">
            Hover Over Me
        </button>

        <span class="tooltip" id="tip" role="tooltip">
            Welcome to CSS!
        </span>
    </div>
</body>
</html>
