
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login UI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #334155);
        }

        .login {
            width: min(360px, 90%);
            padding: 30px;
            border-radius: 16px;
            background: white;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #6366f133;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <form class="login">
        <h2>Welcome Back</h2>

        <label for="email">Email</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>
</body>
</html>
