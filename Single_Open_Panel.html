
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font-family: Arial; max-width: 600px; margin: 30px auto; }
.item { border-bottom: 1px solid #ccc; }
.question { width: 100%; padding: 16px; text-align: left; }
.answer { padding: 16px; background: #f3f4f6; }
</style>
</head>
<body>
<div class="item">
  <button class="question" aria-expanded="false">What is HTML?</button>
  <div class="answer" hidden>HTML structures web content.</div>
</div>
<div class="item">
  <button class="question" aria-expanded="false">What is CSS?</button>
  <div class="answer" hidden>CSS styles web content.</div>
</div>
<div class="item">
  <button class="question" aria-expanded="false">What is JavaScript?</button>
  <div class="answer" hidden>JavaScript adds behavior.</div>
</div>
<script>
document.querySelectorAll(".question").forEach(button => {
  button.onclick = () => {
    const wasOpen = button.getAttribute("aria-expanded") === "true";
    document.querySelectorAll(".question").forEach(other => {
      other.setAttribute("aria-expanded", "false");
      other.nextElementSibling.hidden = true;
    });
    button.setAttribute("aria-expanded", String(!wasOpen));
    button.nextElementSibling.hidden = wasOpen;
  };
});
</script>
</body>
</html>
