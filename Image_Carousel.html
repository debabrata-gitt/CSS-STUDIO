
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; text-align: center; }
.carousel { max-width: 600px; margin: 20px auto; }
.carousel img { width: 100%; height: 300px; object-fit: cover; }
button { padding: 10px 18px; margin: 8px; }
</style>
</head>
<body>
<div class="carousel">
  <img id="photo" alt="Landscape">
  <p id="caption"></p>
  <button id="prev">Previous</button>
  <button id="next">Next</button>
</div>
<script>
const slides = [
  { url: "https://picsum.photos/id/10/600/300", name: "Forest" },
  { url: "https://picsum.photos/id/29/600/300", name: "Workspace" },
  { url: "https://picsum.photos/id/37/600/300", name: "Mountain" }
];
let index = 0;
function render() {
  document.getElementById("photo").src = slides[index].url;
  document.getElementById("caption").textContent =
    `${slides[index].name} (${index + 1}/${slides.length})`;
}
document.getElementById("next").onclick = () => {
  index = (index + 1) % slides.length;
  render();
};
document.getElementById("prev").onclick = () => {
  index = (index - 1 + slides.length) % slides.length;
  render();
};
render();
</script>
</body>
</html>
