<style>
body {
    font-family: Arial;
    background: white;
    color: #222;
    transition: 0.3s;
}
body.dark {
    background: #111827;
    color: white;
}
</style>

<h1>My Website</h1>
<p>Switch between light and dark mode.</p>
<button id="themeButton">Toggle Theme</button>

<script>
document.getElementById("themeButton").onclick = () => {
    document.body.classList.toggle("dark");
};
</script>
