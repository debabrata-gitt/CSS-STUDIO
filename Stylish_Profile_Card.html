
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .card {
            width: min(320px, 90%);
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px #00000018;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 36px;
        }

        h2 {
            margin-bottom: 8px;
        }

        p {
            color: #666;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #4f46e5;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3730a3;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">DP</div>
        <h2>Debabrata Pan</h2>
        <p>Frontend Developer Learner</p>
        <button>View Profile</button>
    </div>
</body>
</html>
